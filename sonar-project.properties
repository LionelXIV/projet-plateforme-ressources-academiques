# =============================
# Configuration SonarCloud
# =============================
sonar.host.url=https://sonarcloud.io

# Identifiants EXACTS depuis SonarCloud
sonar.organization=abdoubenhamideche
sonar.projectKey=plateforme-ressources-academiques
sonar.projectName=Plateforme Ressources Académiques

# Répertoires sources / tests
sonar.sources=backend,frontend/src
sonar.exclusions=**/node_modules/**,frontend/dist/**,backend/**/migrations/**

sonar.tests=backend,frontend/src
sonar.test.inclusions=**/*test*.py,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Couverture (assure-toi que ces fichiers existent dans le pipeline)
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

sonar.sourceEncoding=UTF-8
