# --- LOCAL SONARQUBE ---
sonar.projectKey=plateforme-ressources-academiques
sonar.projectName=Plateforme Ressources Académiques
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# 📁 Dossiers analysés
sonar.sources=frontend,backend

# 🚫 Exclusions globales
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/migrations/**,**/__pycache__/**,**/coverage/**,**/*.config.js,**/*.config.ts,**/*.spec.ts,**/*.spec.tsx

# 🚫 Exclusions spécifiques pour coverage et tests
sonar.coverage.exclusions=**/tests/**,**/*.test.ts,**/*.test.tsx,**/setupTests.ts,**/test_*.py,**/coverage/**,**/vite.config.ts,**/*.config.ts,**/*.config.js

# 🧪 Rapports de couverture
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml
