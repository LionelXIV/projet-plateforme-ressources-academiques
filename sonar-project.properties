# --- LOCAL SONARQUBE ---
sonar.projectKey=plateforme-ressources-academiques
sonar.projectName=Plateforme Ressources Académiques
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# Sources racine
sonar.sources=frontend,backend
sonar.exclusions=**/node_modules/**,**/dist/**,**/.venv/**,**/migrations/**

# Coverage (chemins générés par les jobs)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.python.coverage.reportPaths=backend/coverage.xml
