# =============================
# Configuration SonarCloud UQAR
# =============================

# Identifiants du projet SonarCloud
sonar.projectKey=uqar-projet-qualite
sonar.projectName=Plateforme Ressources Académiques
sonar.organization=uqar-org-qualite

# URL SonarCloud
sonar.host.url=https://sonarcloud.io

# Répertoires sources
sonar.sources=backend,frontend/src

# Fichiers à exclure
sonar.exclusions=**/node_modules/**,frontend/dist/**,backend/**/migrations/**

# Tests à inclure
sonar.tests=backend,frontend/src
sonar.test.inclusions=**/*test*.py,**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx

# Rapports de couverture
sonar.python.coverage.reportPaths=coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Encodage
sonar.sourceEncoding=UTF-8

