# CI/CD complète pour Django (backend) + React/Vite (frontend)
# Étapes :
#  1. frontend_build — compile le frontend React/Vite
#  2. backend_build — installe les dépendances Django
#  3. backend_test — exécute les tests unitaires Django
#  4. sonar — analyse statique SonarCloud (merge_requests et main)

stages:
  - frontend_build
  - backend_build
  - backend_test
  - sonar

# -------------------------------
# Étape 1 : Build du frontend
# -------------------------------
frontend_build:
  stage: frontend_build
  image: node:22
  tags: ["uvs"]
  only:
    - branches
  before_script:
    - cd frontend
  script:
    - npm ci || npm install
    - npm run build
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend
    paths:
      - frontend/node_modules/

# -------------------------------
# Étape 2 : Build du backend (installation des dépendances)
# -------------------------------
backend_build:
  stage: backend_build
  image: python:3.13
  tags: ["uvs"]
  only:
    - branches
  before_script:
    - python -m venv venv
    - source venv/bin/activate
  script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - echo "✅ Backend installé avec succès."
  artifacts:
    name: "backend_env_${CI_COMMIT_REF_SLUG}"
    paths:
      - venv/
    expire_in: never

# -------------------------------
# Étape 3 : Tests Django
# -------------------------------
backend_test:
  stage: backend_test
  image: python:3.13
  tags: ["uvs"]
  only:
    - branches
  dependencies:
    - backend_build
  before_script:
    - source venv/bin/activate
    - export DJANGO_SETTINGS_MODULE=backend.settings
    - export PYTHONPATH=$PWD
    - export SECRET_KEY="gitlab-ci-test-secret-key-1234567890"
  script:
    - echo "✅ Lancement des tests Django..."
    - python manage.py test --noinput
  artifacts:
    when: always
    name: "django_test_reports_${CI_COMMIT_REF_SLUG}"
    paths:
      - test-reports/
    expire_in: never
  coverage: '/^TOTAL.*\s+(\d+\%)$/'

# -------------------------------
# Étape 4 : Analyse SonarCloud
# -------------------------------
sonar_scan:
  stage: sonar           # <- fait correspondre au stage listé
  image: sonarsource/sonar-scanner-cli:latest
  needs: ["backend_test"]  # <- plus de frontend_test ici
  script:
    - |
      # Le .properties contient host/org/key/name. On ne passe que le token.
      sonar-scanner -Dsonar.token="${SONAR_TOKEN}"