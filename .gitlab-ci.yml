# CI/CD complète pour Django (backend) + React/Vite (frontend)
# Étapes :
#  1. frontend_build — compile le frontend React/Vite
#  2. backend_build — installe les dépendances Django
#  3. backend_test — exécute les tests unitaires Django
#  4. sonar — analyse statique SonarCloud (merge_requests et main)

stages:
  - frontend_build
  - backend_build
  - backend_test
  - sonar

# -------------------------------
# Étape 1 : Build du frontend
# -------------------------------
frontend_build:
  stage: frontend_build
  image: node:22
  tags: ["uvs"]
  only:
    - branches
  before_script:
    - cd frontend
  script:
    - npm ci || npm install
    - npm run build
  cache:
    key: ${CI_COMMIT_REF_SLUG}-frontend
    paths:
      - frontend/node_modules/

# -------------------------------
# Étape 2 : Teste du frontend (installation des dépendances)
# -------------------------------
frontend_test:
  stage: backend_test
  image: node:22
  tags: ["uvs"]
  only:
    - branches
  before_script:
    - cd frontend
    - npm ci || npm install
  script:
    - npm run test -- --coverage --run
  artifacts:
    when: always
    name: "frontend_coverage_${CI_COMMIT_REF_SLUG}"
    paths:
      - frontend/coverage/lcov.info
    expire_in: 1 week

# -------------------------------
# Étape 3 : Build du backend (installation des dépendances)
# -------------------------------
backend_build:
  stage: backend_build
  image: python:3.13
  tags: ["uvs"]
  only:
    - branches
  before_script:
    - python -m venv venv
    - source venv/bin/activate
  script:
    - pip install --upgrade pip
    - pip install -r requirements.txt
    - echo "✅ Backend installé avec succès."
  artifacts:
    name: "backend_env_${CI_COMMIT_REF_SLUG}"
    paths:
      - venv/
    expire_in: never

# -------------------------------
# Étape 4 : Tests Django
# -------------------------------
# Étape 4 : Tests Django (avec couverture)
backend_test:
  stage: backend_test
  image: python:3.13
  tags: ["uvs"]
  only:
    - branches
  dependencies:
    - backend_build
  before_script:
    - source venv/bin/activate
    - export DJANGO_SETTINGS_MODULE=backend.settings
    - export PYTHONPATH=$PWD
    - export SECRET_KEY="gitlab-ci-test-secret-key-1234567890"
    - pip install pytest pytest-cov
  script:
    - echo "✅ Lancement des tests Django avec couverture..."
    - pytest -q --maxfail=1 --disable-warnings --cov=backend --cov-report=xml:coverage.xml
  artifacts:
    when: always
    name: "django_test_reports_${CI_COMMIT_REF_SLUG}"
    paths:
      - coverage.xml
      - test-reports/
    expire_in: 1 week
  coverage: '/^TOTAL.*\s+(\d+\%)$/'





# -------------------------------
# Étape 5 : Analyse SonarCloud
# -------------------------------
# -------------------------------
# Étape 5 : Analyse SonarCloud
# -------------------------------
sonar_scan:
  stage: sonar
  image: sonarsource/sonar-scanner-cli:latest
  tags: ["uvs"]
  needs: ["backend_test", "frontend_test"]
  script:
    - |
      # Analyse SonarCloud avec couverture et Quality Gate
      sonar-scanner \
        -Dsonar.token="${SONAR_TOKEN}" \
        -Dsonar.python.coverage.reportPaths=coverage.xml \
        -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info \
        -Dsonar.qualitygate.wait=true
  artifacts:
    when: always
    paths:
      - .scannerwork/report-task.txt
    expire_in: 1 week
